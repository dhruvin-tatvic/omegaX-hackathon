<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Dashboard connection status</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem; background: #111; color: #eee; }
      pre { background: #1a1f28; padding: 1rem; border-radius: 8px; overflow: auto; }
      .bad { color: #ff8a8a; }
      .ok { color: #6ee7a8; }
      a { color: #7eb8ff; }
    </style>
  </head>
  <body>
    <h1>API status</h1>
    <p>If <code>/api/status</code> looks blank in the browser, use this page or view page source.</p>
    <p><a href="/">← Back to traffic dashboard</a></p>
    <pre id="out">Loading…</pre>
    <script>
      fetch('/api/status')
        .then(r => r.text())
        .then(t => {
          const el = document.getElementById('out');
          try {
            const j = JSON.parse(t);
            el.textContent = JSON.stringify(j, null, 2);
            el.className = j.configured ? 'ok' : 'bad';
          } catch {
            el.textContent = t || '(empty response — is npm start running?)';
            el.className = 'bad';
          }
        })
        .catch(e => {
          document.getElementById('out').textContent = String(e);
          document.getElementById('out').className = 'bad';
        });
    </script>
  </body>
</html>
